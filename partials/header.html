<a class="skip-link" href="#main">Skip to content</a>
<header class="header" id="site-header">
  <div class="wrap header__inner">
    <a class="brand" href="{{BASE}}index.html" aria-label="{{NAME}} — {{SUB_NAME}}, home">
      <img class="brand__mark" src="{{BASE}}assets/img/logo.png" width="424" height="440"
           alt="{{NAME}} — {{SUB_NAME}}">
    </a>
    <nav class="header__contact" aria-label="Contact us">
      <a class="pill" href="tel:{{PHONE}}">
        {{ICON_PHONE}}<span class="pill__label">{{PHONE_DISPLAY}}</span>
        <span class="visually-hidden">Call {{PHONE_DISPLAY}}</span>
      </a>
      <a class="pill" href="{{WA_URL}}" target="_blank" rel="noopener">
        {{ICON_WA}}<span class="pill__label">WhatsApp</span>
        <span class="visually-hidden">Message us on WhatsApp</span>
      </a>
      <a class="pill" href="mailto:{{EMAIL}}">
        {{ICON_MAIL}}<span class="pill__label">Email</span>
        <span class="visually-hidden">Email {{EMAIL}}</span>
      </a>
    </nav>
  </div>
  <div class="fret" aria-hidden="true"></div>
</header>
